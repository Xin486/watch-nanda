# Optional: include inside the existing application server. For Nanjing this is
# the loopback 18080 server; retain the outer SafeLine/LAN policy unchanged.
location ^~ /api/ops/hermes/ {
    proxy_pass http://127.0.0.1:7981;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_buffering off;
    client_max_body_size 64k;
}
