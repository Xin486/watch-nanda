user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    server_tokens off;
    keepalive_timeout 30;
    limit_req_zone $binary_remote_addr zone=agent_report:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=agent_connections:10m;

    server {
        listen 3000;
        server_name 192.168.1.24;
        root /var/www/watch-nanda;
        index index.html;
        location / { try_files $uri $uri/ /index.html; }
    }

    server {
        listen 443 ssl;
        server_name 192.168.1.24;
        ssl_certificate /etc/node-monitor/tls/server.crt;
        ssl_certificate_key /etc/node-monitor/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 64k;
        client_body_timeout 15s;
        location = /api/agent/report {
            limit_req zone=agent_report burst=100 nodelay;
            limit_req_status 429;
            limit_conn agent_connections 100;
            proxy_pass http://127.0.0.1:7980;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 20s;
        }
        location / { return 404; }
    }
}
