user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    server_tokens off;
    keepalive_timeout 30;
    limit_req_zone $binary_remote_addr zone=agent_report:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=agent_connections:10m;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen __HTTPS_PORT__ ssl;
__IPV6_LISTEN__
        server_name __SITE_HOST__;
        ssl_certificate __TLS_CERT__;
        ssl_certificate_key __TLS_KEY__;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        client_max_body_size 64k;
        client_body_timeout 15s;
        location = /api/agent/report {
            limit_req zone=agent_report burst=100 nodelay;
            limit_req_status 429;
            limit_conn agent_connections 100;
            proxy_pass http://127.0.0.1:__BACKEND_PORT__;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 20s;
        }
        root __STATIC_DIR__;
        index index.html;
        location /api/ {
            # Management networks are supplied by render_nginx.py.
__ADMIN_ALLOW__
            allow 127.0.0.1;
            deny all;
            proxy_pass http://127.0.0.1:__BACKEND_PORT__;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 65s;
        }
        location / {
            # Keep the same LAN/SD-WAN access policy for the UI and API.
__ADMIN_ALLOW__
            allow 127.0.0.1;
            deny all;
            try_files $uri $uri/ /index.html;
        }
    }
}
