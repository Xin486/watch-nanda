# Include inside the Nginx http block; the SafeLine container stays loopback-only.
server {
    listen 192.168.1.24:9443 ssl;
    server_name 192.168.1.24;
    ssl_certificate /etc/node-monitor/tls/server.crt;
    ssl_certificate_key /etc/node-monitor/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # SD-WAN users arrive through the SNAT gateway 192.168.1.199.
    allow 192.168.1.0/24;
    deny all;
    client_max_body_size 20m;
    location / {
        proxy_pass https://127.0.0.1:19443;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
