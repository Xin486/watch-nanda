# Include inside the Nginx http block; the SafeLine container stays loopback-only.
server {
    listen __HTTPS_PORT__ ssl;
__IPV6_LISTEN__
    server_name __SITE_HOST__;
    ssl_certificate __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Supply the actual management networks when rendering.
__ADMIN_ALLOW__
    deny all;
    client_max_body_size 20m;
    location / {
        proxy_pass https://127.0.0.1:19443;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
